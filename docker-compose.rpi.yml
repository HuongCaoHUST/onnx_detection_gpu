services:
  onnx_pipeline:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    image: onnx_detection_gpu-onnx_pipeline:rpi
    container_name: onnx_pipeline_rpi
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ORT_DISABLE_CUDA=1
      - GST_DEBUG=${GST_DEBUG:-0}
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENCV_FOR_THREADS_NUM=1
      - ORT_INTRA_THREADS=${ORT_INTRA_THREADS:-2}
      - ORT_INTER_THREADS=${ORT_INTER_THREADS:-1}
      - VIDEO_PATH=${VIDEO_PATH:-/videos/input.mp4}
      - DISPLAY_FPS=${DISPLAY_FPS:-15}
      - INFER_FPS_NUM=${INFER_FPS_NUM:-3}
      - INFER_FPS_DEN=${INFER_FPS_DEN:-1}
      - CONF_THRESHOLD=${CONF_THRESHOLD:-0.45}
      - NMS_THRESHOLD=${NMS_THRESHOLD:-0.45}
      - ENABLE_CLASSIFIER=${ENABLE_CLASSIFIER:-0}
      - USE_TRACKER=${USE_TRACKER:-1}
      - MOTION_COMPENSATION=${MOTION_COMPENSATION:-linear}
      - FILTER_CLASSES=${FILTER_CLASSES:-}
      - DRAW_LABELS=${DRAW_LABELS:-false}
      - VIDEO_SINK=${VIDEO_SINK:-kmssink}
      - PRINT_CONFIG=${PRINT_CONFIG:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./:/app/host_data
      - ./videos:/videos:ro
    devices:
      - /dev/dri:/dev/dri
    network_mode: host
    shm_size: 512m
    command: /bin/bash /app/host_data/run_with_display_rpi.sh
